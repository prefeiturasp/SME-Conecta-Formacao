<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Certificado</title>

    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
        }

        .pagina {
            width: 1123px;
            height: 794px;
            position: relative;
            overflow: hidden;
            background: white;
            font-family: Roboto, sans-serif;
        }

        /* IMAGENS (FUNDO) */
        .topo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: block;
            z-index: 0;
        }

        .brasao {
            position: absolute;
            width: 300px;
            height: auto;
            margin-top: 80px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .selo {
            position: absolute;
            width: 140px;
            height: auto;
            bottom: 49px;
            right: 120px;
            z-index: 0;
        }

        /* TEXTO (ACIMA DAS IMAGENS) */
        .titulo {
            position: absolute;
            width: 100%;
            top: 210px;
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 35px;
            line-height: 100%;
            color: #000;
        }

        .texto-certificado {
            position: absolute;
            top: 355px;
            left: 10;
            right: 10;
            margin: 0 125px;
            text-align: center;
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            font-size: 19px;
            line-height: 25px;
            color: #000;
        }

        /* ASSINATURA */
        .assinatura-container {
            position: absolute;
            top: 152mm;
            width: 100%;
            text-align: center;
        }

        .img-assinatura {
            width: 350px;
            height: auto;
            display: block;
            margin: 0 auto -35px auto;
            position: relative;
            z-index: 2;
        }

        .linha-assinatura {
            width: 320px;
            height: 3px;
            background: #000;
            margin: 0px auto 8px auto;
            position: relative;
            z-index: 1;
        }

        .nome-assinatura {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .cargo-assinatura {
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            font-size: 15px;
            margin-top: 1px;
        }

        /* FOOTER */
        .footer-text {
            position: absolute;
            bottom: 45px;
            left: 320px;
            right: 320px;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #333;
            line-height: 1.2;
            text-align: center;
            overflow-wrap: break-word;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="pagina">

        <img class="topo" src="header.svg" alt="Cabeçalho">

        <img class="brasao" src="brasao.png" alt="Brasão">

        <img class="selo {{CLASSE_SELO}}" src="selo.svg" alt="Selo">

        <h1 class="titulo">CERTIFICADO</h1>

        <div class="texto-certificado">
            {{TEXTO_CERTIFICADO}}
        </div>

        <div class="assinatura-container">
            <img src="assinatura.png" class="img-assinatura" alt="Assinatura" />
            <div class="linha-assinatura"></div>
            <div class="nome-assinatura">Fernando Padula</div>
            <div class="cargo-assinatura">Secretário Municipal de Educação</div>
        </div>

        <div class="footer-text">
            {{COORDENADORIA_OU_DRE}} - Certificado registrado sob nº {{NUM_CODIGO_CERTIFICADO}}, Com. nº {{NUM_COMUNICADO}} - DOC {{DATA_PUBLICACAO_CODAF}}, pág. {{PAG_DIARIO_OFICIAL}}, Homologação nº {{NUM_HOM_FORMACAO}}.
        </div>

    </div>
</body>
</html>
